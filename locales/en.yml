en:
  theme_metadata:
    description: "Idle screensaver that turns paragraphs from public topics into animated geometric text."
    settings:
      text_jumble_enabled: "Enable the text jumble idle screensaver."
      text_jumble_idle_seconds: "Seconds of inactivity before the screensaver appears."
      text_jumble_text_source: "Choose whether the screensaver uses editable quotes or random topic paragraphs."
      text_jumble_topic_source: "Topic list used when choosing a random paragraph."
      text_jumble_min_paragraph_length: "Minimum paragraph length to use from a topic."
      text_jumble_read_seconds: "Seconds to keep text readable before each animation cycle starts."
      text_jumble_after_animation_read_seconds: "Seconds to keep text readable again after an animation cycle completes, before switching to a new quote or post."
      text_jumble_renderer: "Renderer used for drawing animated text."
      text_jumble_animation_mode: "Animation mode for letter motion."
      text_jumble_fallback_text: "Fallback paragraph used when a topic paragraph cannot be loaded."
      text_jumble_quote_1: "First editable quote used when quote mode is enabled."
      text_jumble_quote_2: "Second editable quote used when quote mode is enabled."
      text_jumble_quote_3: "Third editable quote used when quote mode is enabled."
      text_jumble_quote_4: "Fourth editable quote used when quote mode is enabled."
      text_jumble_quote_5: "Fifth editable quote used when quote mode is enabled."
