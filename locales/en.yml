en:
  theme_metadata:
    description: "Idle screensaver that turns paragraphs from public topics into animated geometric text."
    settings:
      text_jumble_enabled: "Enable the text jumble idle screensaver."
      text_jumble_idle_seconds: "Seconds of inactivity before the screensaver appears."
      text_jumble_topic_source: "Topic list used when choosing a random paragraph."
      text_jumble_min_paragraph_length: "Minimum paragraph length to use from a topic."
      text_jumble_cycle_seconds: "Seconds before fetching a new paragraph while the screensaver is visible."
      text_jumble_animation_mode: "Animation mode for letter motion."
      text_jumble_fallback_text: "Fallback paragraph used when a topic paragraph cannot be loaded."
